name: MCP release

on:
  push:
    tags: ['mcp-v*']

env:
  MCP_IMAGE: ghcr.io/emilijan-koteski/monexa-mcp
  MCP_PUBLISHER_VERSION: v1.8.1
  MCP_PUBLISHER_SHA256: a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc
  DOCKER_BUILD_RECORD_UPLOAD: false

permissions:
  contents: read

jobs:
  image:
    name: Push versioned image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@v5
      - id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#mcp-v}"
          package_version=$(jq -r .version mcp-server/package.json)
          server_version=$(jq -r .version mcp-server/server.json)
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag ${TAG} does not end in a semantic version"
            exit 1
          fi
          if [ "$version" != "$package_version" ] || [ "$version" != "$server_version" ]; then
            echo "::error::Tag ${TAG} is version ${version}, but mcp-server/package.json is ${package_version} and mcp-server/server.json is ${server_version}"
            exit 1
          fi
          echo "value=${version}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
        with:
          cleanup: false
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.MCP_IMAGE }}
          flavor: latest=false
          tags: type=raw,value=v${{ steps.version.outputs.value }}
      - uses: docker/build-push-action@v7
        with:
          context: ./mcp-server
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=mcp

  registry:
    name: Publish to the MCP Registry
    runs-on: ubuntu-latest
    needs: image
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - name: Install mcp-publisher
        working-directory: ${{ runner.temp }}
        run: |
          archive=mcp-publisher_linux_amd64.tar.gz
          curl -fsSL -o "$archive" "https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/${archive}"
          echo "${MCP_PUBLISHER_SHA256}  ${archive}" | sha256sum --check --strict
          tar -xzf "$archive" mcp-publisher
          sudo install -m 0755 mcp-publisher /usr/local/bin/mcp-publisher
      - name: Publish server.json
        working-directory: mcp-server
        run: |
          mcp-publisher login github-oidc
          mcp-publisher publish
