name: Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: deploy-master
  cancel-in-progress: false

env:
  BACKEND_IMAGE: ghcr.io/emilijan-koteski/monexa-backend
  FRONTEND_IMAGE: ghcr.io/emilijan-koteski/monexa-frontend

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.backend == 'true' }}
      frontend: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.frontend == 'true' }}
      tag: sha-${{ steps.sha.outputs.short }}
    steps:
      - uses: actions/checkout@v5
      - id: sha
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      # Manual runs rebuild everything; pushes rebuild only what changed.
      - uses: dorny/paths-filter@v3
        id: filter
        if: github.event_name == 'push'
        with:
          filters: |
            backend:
              - 'cmd/**'
              - 'internal/**'
              - 'templates/**'
              - 'go.mod'
              - 'go.sum'
              - 'Dockerfile'
              - '.dockerignore'
              - '.github/workflows/deploy.yml'
            frontend:
              - 'frontend/**'
              - '.github/workflows/deploy.yml'

  build-backend:
    name: Build backend image
    runs-on: ubuntu-latest
    needs: [test, changes]
    if: success() && needs.changes.outputs.backend == 'true'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.BACKEND_IMAGE }}
          tags: |
            type=raw,value=${{ needs.changes.outputs.tag }}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

  build-frontend:
    name: Build frontend image
    runs-on: ubuntu-latest
    needs: [test, changes]
    if: success() && needs.changes.outputs.frontend == 'true'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.FRONTEND_IMAGE }}
          tags: |
            type=raw,value=${{ needs.changes.outputs.tag }}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: ./frontend
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # The only production configuration; not secrets.
          build-args: |
            VITE_API_BASE_URL=https://api.monexa.world/api/v1
            VITE_LEGAL_COMPLIANCE_ENABLED=false
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  deploy:
    name: Deploy to Dokploy
    runs-on: ubuntu-latest
    needs: [changes, build-backend, build-frontend]
    # Run when at least one image was built and nothing failed (skipped builds are fine).
    if: >-
      ${{ !cancelled()
          && needs.build-backend.result != 'failure'
          && needs.build-frontend.result != 'failure'
          && (needs.build-backend.result == 'success' || needs.build-frontend.result == 'success') }}
    env:
      DOKPLOY_URL: https://dokploy.monexa.world
      DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
    steps:
      - uses: actions/checkout@v5
      - name: Deploy backend
        if: needs.build-backend.result == 'success'
        env:
          APP_ID: ${{ secrets.DOKPLOY_BACKEND_APP_ID }}
          IMAGE: ${{ env.BACKEND_IMAGE }}:${{ needs.changes.outputs.tag }}
        run: .github/scripts/dokploy-deploy.sh
      - name: Deploy frontend
        if: needs.build-frontend.result == 'success'
        env:
          APP_ID: ${{ secrets.DOKPLOY_FRONTEND_APP_ID }}
          IMAGE: ${{ env.FRONTEND_IMAGE }}:${{ needs.changes.outputs.tag }}
        run: .github/scripts/dokploy-deploy.sh
