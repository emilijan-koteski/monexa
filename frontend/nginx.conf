# Included from the image's nginx.conf inside the http{} block.
# nginx runs unprivileged on 8080; TLS is terminated by Traefik in front of it.

# Vite writes hashed filenames under /assets/, so those are immutable; everything else
# (index.html, favicons) must be revalidated so deploys take effect immediately.
map $uri $cache_control {
    default        "no-cache";
    ~^/assets/     "public, max-age=31536000, immutable";
}

server {
    listen 8080;
    listen [::]:8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json application/xml image/svg+xml;

    # Declared once at server level; nested add_header would override the whole set.
    add_header Cache-Control $cache_control always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "OK\n";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
